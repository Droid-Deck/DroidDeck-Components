name: Build Qualcomm runtime

on:
  push:
    branches: [qualcomm-runtime, qualcomm-runtime-r3]
    paths:
      - 'tools/qualcomm-runtime/**'
      - '.github/workflows/build-qualcomm-runtime.yml'

permissions:
  contents: write

env:
  SOURCE_REPO: Droid-Deck/DroidDeck
  SOURCE_SHA: 4b8c7f84150768f821a05b8a5eae8afb80248eaf
  TAG: qualcomm-runtime-r3-4b8c7f84-qa
  PRERELEASE: 'true'

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_SHA }}
          path: dd
          persist-credentials: false
      - name: Build in Arch Linux ARM
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/work" -w /work menci/archlinuxarm:base-devel bash tools/qualcomm-runtime/build-in-arch.sh
          sudo chown -R "$(id -u):$(id -g)" .
      # The libhybris bridge and the WSI layer archive were published on wallentx/DroidDeck. They are copied here
      # unchanged, checked against the pins in the source tree, so DroidDeck does not depend on that account.
      - name: Mirror the pinned bridge and WSI archives
        run: python3 tools/qualcomm-runtime/mirror.py dd/tools/qualcomm/runtime.json mirror
      - uses: actions/upload-artifact@v4
        with:
          name: qualcomm-runtime
          path: |
            qualcomm-builds.tar.xz
            qualcomm-builds.tar.xz.sha256
            gamescope-build.json
            zink-build.json
            wsi-build.json
            mirror/*
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then echo "::error::$TAG exists; a published tag is never replaced"; exit 1; fi
          {
            echo "Qualcomm Gamescope, Zink and WSI for the experimental Qualcomm backend, built by tools/qualcomm/build_{gamescope,zink,wsi}.py at ${SOURCE_REPO}@${SOURCE_SHA} in Arch Linux ARM. The Gamescope source is inside the archive (source.tar.gz); Mesa and WSI sources are pinned in their licenses. sha256 $(cut -d' ' -f1 qualcomm-builds.tar.xz.sha256)"
            echo
            cat mirror/MIRROR.md
          } > notes.md
          pre=()
          [ "$PRERELEASE" = true ] && pre=(--prerelease)
          gh release create "$TAG" "${pre[@]}" --latest=false --title "$TAG" --notes-file notes.md \
            qualcomm-builds.tar.xz qualcomm-builds.tar.xz.sha256 gamescope-build.json zink-build.json wsi-build.json \
            mirror/*.tzst mirror/*.zip mirror/mirror.json
